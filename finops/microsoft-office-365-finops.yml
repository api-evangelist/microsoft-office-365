principles:
  - name: Visibility
    description: Use the Microsoft 365 admin centre Active Users and product-usage reports, plus Microsoft
      Cost Management for the SKU billing line.
  - name: Allocation
    description: Map seat licences to Entra groups bound to cost-centres for chargeback / showback; use
      group-based licensing to keep allocation in sync.
  - name: Optimization
    description: Right-size SKU mix (Business Basic for kiosk/web users, Standard / E3 for desktop power
      users, E5 only where Power BI Pro / Defender P2 / Entra ID P2 is needed); reclaim inactive licences
      via Microsoft 365 admin centre activity reports.
  - name: Accountability
    description: IT owns SKU mix and Entra group-based licence assignment; finance owns the contract;
      app owners reconcile programmatic Graph usage to the throttling budget.
