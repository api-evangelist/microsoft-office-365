  /me/events/{event-id}/accept:
    post:
      operationId: acceptEvent
      summary: Microsoft Office 365 Accept Event
      description: Accept the specified event in a user calendar. Requires Calendars.ReadWrite permission.
      tags:
      - Calendar
      parameters:
      - $ref: '#/components/parameters/eventId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  description: Text included in the response. Optional.
                sendResponse:
                  type: boolean
                  description: Whether a response is to be sent to the organizer. Default is true.
                  default: true
            examples:
              AccepteventRequestExample:
                summary: Default acceptEvent request
                x-microcks-default: true
                value:
                  comment: example_value
                  sendResponse: true
      responses:
        '202':
          description: Event accepted. No content returned.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /me/events/{event-id}/decline:
    post:
      operationId: declineEvent
      summary: Microsoft Office 365 Decline Event
      description: Decline invitation to the specified event in a user calendar. Requires Calendars.ReadWrite permission.
      tags:
      - Calendar
      parameters:
      - $ref: '#/components/parameters/eventId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  description: Text included in the response. Optional.
                sendResponse:
                  type: boolean
                  description: Whether a response is to be sent to the organizer. Default is true.
                  default: true
                proposedNewTime:
                  $ref: '#/components/schemas/TimeSlot'
            examples:
              DeclineeventRequestExample:
                summary: Default declineEvent request
                x-microcks-default: true
                value:
                  comment: example_value
                  sendResponse: true
                  proposedNewTime:
                    start:
                      dateTime: example_value
                      timeZone: example_value
                    end:
                      dateTime: example_value
                      timeZone: example_value
      responses:
        '202':
          description: Event declined. No content returned.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    ODataError:
      type: object
      description: The error response from the Microsoft Graph API following OData conventions.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: The error code string.
            message:
              type: string
              description: A human-readable error message.
            innerError:
              type: object
              properties:
                date:
                  type: string
                  format: date-time
                request-id:
                  type: string
                client-request-id:
                  type: string
          example: example_value
    PatternedRecurrence:
      type: object
      description: The recurrence pattern and range.
      properties:
        pattern:
          $ref: '#/components/schemas/RecurrencePattern'
        range:
          $ref: '#/components/schemas/RecurrenceRange'
    OutlookGeoCoordinates:
      type: object
      description: The geographic coordinates and elevation of a location.
      properties:
        latitude:
          type: number
          format: double
          example: 42.5
        longitude:
          type: number
          format: double
          example: 42.5
        accuracy:
          type: number
          format: double
          example: 42.5
        altitude:
          type: number
          format: double
          example: 42.5
        altitudeAccuracy:
          type: number
          format: double
          example: 42.5
    RecurrencePattern:
      type: object
      description: Describes the frequency by which a recurring event repeats.
      properties:
        type:
          type: string
          enum:
          - daily
          - weekly
          - absoluteMonthly
          - relativeMonthly
          - absoluteYearly
          - relativeYearly
          description: The recurrence pattern type.
          example: daily
        interval:
          type: integer
          description: The number of units between occurrences, where units can be in days, weeks, months, or years.
          example: 10
        daysOfWeek:
          type: array
          items:
            type: string
            enum:
            - sunday
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
          description: A collection of the days of the week on which the event occurs.
          example: []
        dayOfMonth:
          type: integer
          description: The day of the month on which the event occurs.
          example: 10
        month:
          type: integer
          description: The month in which the event occurs (1-12).
          example: 10
        firstDayOfWeek:
          type: string
          enum:
          - sunday
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          description: The first day of the week.
          example: sunday
        index:
          type: string
          enum:
          - first
          - second
          - third
          - fourth
          - last
          description: The week index for relative monthly and yearly patterns.
          example: first
    Recipient:
      type: object
      description: Represents information about a user in the sending or receiving end of a message or event.
      properties:
        emailAddress:
          $ref: '#/components/schemas/EmailAddress'
    Location:
      type: object
      description: Represents location information of an event.
      properties:
        displayName:
          type: string
          description: The name associated with the location.
          example: example_value
        locationType:
          type: string
          enum:
          - default
          - conferenceRoom
          - homeAddress
          - businessAddress
          - geoCoordinates
          - streetAddress
          - hotel
          - restaurant
          - localBusiness
          - postalAddress
          description: The type of location.
          example: default
        locationUri:
          type: string
          description: Optional URI representing the location.
          example: example_value
        address:
          $ref: '#/components/schemas/PhysicalAddress'
        coordinates:
          $ref: '#/components/schemas/OutlookGeoCoordinates'
        uniqueId:
          type: string
          description: For internal use only.
          example: '500123'
        uniqueIdType:
          type: string
          enum:
          - unknown
          - locationStore
