components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: >-
        Microsoft identity platform OAuth 2.0 authorization. Supports
        delegated (user) and application-only permissions. Microsoft Graph
        uses scopes to control access to resources.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
          scopes:
            User.Read: Sign in and read user profile
            User.ReadBasic.All: Read all users' basic profiles
            User.Read.All: Read all users' full profiles
            User.ReadWrite: Read and update your profile
            User.ReadWrite.All: Read and write all users' full profiles
            Directory.Read.All: Read directory data
            Directory.ReadWrite.All: Read and write directory data
            Group.Read.All: Read all groups
            Group.ReadWrite.All: Read and write all groups
            GroupMember.Read.All: Read all group memberships
            GroupMember.ReadWrite.All: Read and write all group memberships
            Mail.ReadBasic: Read user basic mail
            Mail.Read: Read user mail
            Mail.ReadWrite: Read and write user mail
            Mail.Send: Send mail as a user
            Calendars.Read: Read user calendars
            Calendars.ReadWrite: Read and write user calendars
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token
          scopes:
            https://graph.microsoft.com/.default: Default scope for application permissions
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Bearer token obtained from the Microsoft identity platform. Use an
        access token in the Authorization header of each request.

  parameters:
    userId:
      name: user-id
      in: path
      required: true
      description: The unique identifier of the user (GUID) or the userPrincipalName.
      schema:
        type: string
    groupId:
      name: group-id
      in: path
      required: true
      description: The unique identifier of the group (GUID).
      schema:
        type: string
    messageId:
      name: message-id
      in: path
      required: true
      description: The unique identifier of the message.
      schema:
        type: string
    eventId:
      name: event-id
      in: path
      required: true
      description: The unique identifier of the event.
      schema:
        type: string
    top:
      name: $top
      in: query
      description: The number of items to return in a result set. Maximum value depends on the API.
      schema:
        type: integer
        minimum: 1
    skip:
      name: $skip
      in: query
      description: The number of items to skip in the result set.
      schema:
        type: integer
        minimum: 0
    filter:
      name: $filter
      in: query
      description: OData filter expression to restrict the set of items returned.
      schema:
        type: string
    select:
      name: $select
      in: query
      description: Comma-separated list of properties to include in the response.
      schema:
        type: string
    orderby:
      name: $orderby
      in: query
      description: Comma-separated list of properties for sorting results.
      schema:
        type: string
    search:
      name: $search
      in: query
      description: Search expression to filter results. Uses KQL syntax for directory objects.
      schema:
        type: string
    count:
      name: $count
      in: query
      description: Include a count of the total number of items in a collection alongside the page of data values.
      schema:
        type: boolean
    expand:
      name: $expand
      in: query
      description: Comma-separated list of relationships to expand and include in the response.
      schema:
        type: string

  schemas:
    # ── User schemas ───────────────────────────────────────────────────
    User:
      type: object
      description: >-
        Represents an Azure Active Directory user account. Inherits from
        directoryObject. Contains the user's profile information, organizational
        hierarchy, assigned licenses, and managed resources.
      properties:
        id:
          type: string
          readOnly: true
          description: >-
            The unique identifier for the user. Inherited from directoryObject.
            GUID format.
          example: abc123
        displayName:
          type: string
          description: The name displayed in the address book for the user.
          example: example_value
        givenName:
          type: string
          description: The given name (first name) of the user.
          example: example_value
        surname:
          type: string
          description: The user's surname (family name or last name).
          example: example_value
        mail:
          type: string
          format: email
          description: >-
            The SMTP address for the user. This property cannot contain accent
            characters.
          example: example_value
        userPrincipalName:
          type: string
          description: >-
            The user principal name (UPN) of the user. The UPN is an
            Internet-style login name based on RFC 822. By convention, this
            should map to the user's email name.
          example: example_value
        jobTitle:
          type: string
          description: The user's job title.
          example: example_value
        department:
          type: string
          description: The name of the department in which the user works.
          example: example_value
        officeLocation:
          type: string
          description: The office location in the user's place of business.
          example: example_value
        companyName:
          type: string
          description: The company name associated with the user.
          example: example_value
        businessPhones:
          type: array
          items:
            type: string
          description: The telephone numbers for the user.
          example: []
        mobilePhone:
          type: string
          description: The primary cellular telephone number for the user.
          example: example_value
        streetAddress:
          type: string
          description: The street address of the user's place of business.
          example: example_value
        city:
          type: string
          description: The city in which the user is located.
          example: example_value
        state:
          type: string
          description: The state or province in the user's address.
          example: example_value
        postalCode:
          type: string
          description: The postal code for the user's postal address.
          example: example_value
        country:
          type: string
          description: >-
            The country or region in which the user is located; for example,
            US or UK.
          example: example_value
        preferredLanguage:
          type: string
          description: >-
            The preferred language for the user. Should follow ISO 639-1 Code;
            for example en-US.
          example: example_value
        accountEnabled:
          type: boolean
          description: >-
            True if the account is enabled; otherwise, false. Required when
            creating a user.
          example: true
        createdDateTime:
          type: string
          format: date-time
          readOnly: true
          description: The date and time the user was created in ISO 8601 format.
          example: '2026-01-15T10:30:00Z'
        lastSignInDateTime:
          type: string
          format: date-time
          readOnly: true
          description: >-
            The date and time of the user's most recent interactive or
            non-interactive sign-in.
          example: '2026-01-15T10:30:00Z'
        usageLocation:
          type: string
          description: >-
            A two-letter country code (ISO 3166) required for users who will be
            assigned licenses. Not nullable.
          example: example_value
        passwordProfile:
          $ref: '#/components/schemas/PasswordProfile'
        identities:
          type: array
          items:
            $ref: '#/components/schemas/ObjectIdentity'
          description: >-
            Represents the identities that can be used to sign in to this user
            account.
          example: []
        assignedLicenses:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/AssignedLicense'
          description: The licenses assigned to the user.
          example: []
        manager:
          $ref: '#/components/schemas/DirectoryObject'
        memberOf:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/DirectoryObject'
          description: The groups, directory roles, and administrative units the user is a member of.

          example: []
    UserCreateRequest:
      type: object
      required:
      - accountEnabled
      - displayName
      - mailNickname
      - userPrincipalName
      - passwordProfile
      properties:
        accountEnabled:
          type: boolean
          description: True if the account is enabled; otherwise, false.
          example: true
        displayName:
          type: string
          description: The name to display in the address book for the user.
          example: example_value
        mailNickname:
          type: string
          description: The mail alias for the user.
          example: example_value
        userPrincipalName:
          type: string
          description: >-
            The user principal name (someuser@contoso.com).
          example: example_value
        passwordProfile:
          $ref: '#/components/schemas/PasswordProfile'
        givenName:
          type: string
          example: example_value
        surname:
          type: string
          example: example_value
        jobTitle:
          type: string
          example: example_value
        department:
          type: string
          example: example_value
        officeLocation:
          type: string
          example: example_value
        mobilePhone:
          type: string
          example: example_value
        usageLocation:
          type: string

          example: example_value
    UserUpdateRequest:
      type: object
      properties:
        displayName:
          type: string
          example: example_value
        givenName:
          type: string
          example: example_value
        surname:
          type: string
          example: example_value
        jobTitle:
          type: string
          example: example_value
        department:
          type: string
          example: example_value
        officeLocation:
          type: string
          example: example_value
        mobilePhone:
          type: string
          example: example_value
        businessPhones:
          type: array
          items:
            type: string
          example: []
        streetAddress:
          type: string
          example: example_value
        city:
          type: string
          example: example_value
        state:
          type: string
          example: example_value
        postalCode:
          type: string
          example: example_value
        country:
          type: string
          example: example_value
        preferredLanguage:
          type: string
          example: example_value
        accountEnabled:
          type: boolean
          example: true
        usageLocation:
          type: string
          example: example_value
        passwordProfile:
          $ref: '#/components/schemas/PasswordProfile'

    UserCollectionResponse:
      type: object
      properties:
        '@odata.context':
          type: string
          description: The OData context URL for the collection.
          example: example_value
        '@odata.count':
          type: integer
          description: The total count of items in the collection (if requested).
          example: 10
        '@odata.nextLink':
          type: string
          format: uri
          description: The URL to retrieve the next page of results.
          example: https://www.example.com
        value:
          type: array
          items:
            $ref: '#/components/schemas/User'

          example: []
    PasswordProfile:
      type: object
      description: Contains the password profile associated with a user.
      properties:
        forceChangePasswordNextSignIn:
          type: boolean
          description: Whether the user must change the password on the next sign-in.
          default: true
          example: true
        forceChangePasswordNextSignInWithMfa:
          type: boolean
          description: >-
            Whether the user must perform multi-factor authentication before
            being forced to change their password.
          default: false
          example: true
        password:
          type: string
          format: password
          description: >-
            The password for the user. Must satisfy the tenant's password
            complexity requirements. Minimum of 8 characters.

          example: example_value
    ObjectIdentity:
      type: object
      description: Represents an identity used to sign in to a user account.
      properties:
        signInType:
          type: string
          description: >-
            Specifies the type of user sign-in (e.g. emailAddress,
            userName, userPrincipalName).
          example: example_value
        issuer:
          type: string
          description: >-
            Specifies the issuer of the identity, for example
            contoso.onmicrosoft.com.
          example: example_value
        issuerAssignedId:
          type: string
          description: >-
            Specifies the unique value associated with the issuer-
            signInType combination.

          example: '500123'
    AssignedLicense:
      type: object
      description: Represents a license assigned to a user.
      properties:
        disabledPlans:
          type: array
          items:
            type: string
          description: A collection of unique identifiers for disabled plans.
          example: []
        skuId:
          type: string
          description: The unique identifier for the SKU.

          example: '500123'
    DirectoryObject:
