                      streetAddress: example_value
                      city: example_value
                      state: example_value
                      postalCode: example_value
                      country: example_value
                      preferredLanguage: example_value
                      accountEnabled: true
                      createdDateTime: '2026-01-15T10:30:00Z'
                      lastSignInDateTime: '2026-01-15T10:30:00Z'
