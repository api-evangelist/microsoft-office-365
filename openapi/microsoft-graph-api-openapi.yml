          items:
            $ref: '#/components/schemas/Calendar'

          example: []
    DateTimeTimeZone:
      type: object
      description: Describes the date, time, and time zone of a point in time.
      properties:
        dateTime:
          type: string
          description: >-
            A single point of time in a combined date and time representation
            ({date}T{time}; for example, 2017-08-29T04:00:00.0000000).
          example: example_value
        timeZone:
          type: string
          description: >-
            The time zone for the time. For example, Pacific Standard Time.
            See https://learn.microsoft.com/en-us/graph/api/resources/datetimetimezone

          example: example_value
    Location:
      type: object
      description: Represents location information of an event.
      properties:
        displayName:
          type: string
          description: The name associated with the location.
          example: example_value
        locationType:
          type: string
          enum:
          - default
          - conferenceRoom
          - homeAddress
          - businessAddress
          - geoCoordinates
          - streetAddress
          - hotel
          - restaurant
          - localBusiness
          - postalAddress
          description: The type of location.
          example: default
        locationUri:
          type: string
          description: Optional URI representing the location.
          example: example_value
        address:
          $ref: '#/components/schemas/PhysicalAddress'
        coordinates:
          $ref: '#/components/schemas/OutlookGeoCoordinates'
        uniqueId:
          type: string
          description: For internal use only.
          example: '500123'
        uniqueIdType:
          type: string
          enum:
          - unknown
          - locationStore
          - directory
          - private
          - bing
          description: For internal use only.

          example: unknown
    PhysicalAddress:
      type: object
      description: Represents the street address of a resource such as a contact or event.
      properties:
        street:
          type: string
          example: example_value
        city:
          type: string
          example: example_value
        state:
          type: string
          example: example_value
        countryOrRegion:
          type: string
          example: example_value
        postalCode:
          type: string

          example: example_value
    OutlookGeoCoordinates:
      type: object
      description: The geographic coordinates and elevation of a location.
      properties:
        latitude:
          type: number
          format: double
          example: 42.5
        longitude:
          type: number
          format: double
          example: 42.5
        accuracy:
          type: number
          format: double
          example: 42.5
        altitude:
          type: number
          format: double
          example: 42.5
        altitudeAccuracy:
          type: number
          format: double

          example: 42.5
    Attendee:
      type: object
      description: An event attendee that can be a person or resource.
      properties:
        emailAddress:
          $ref: '#/components/schemas/EmailAddress'
        type:
          type: string
          enum:
          - required
          - optional
          - resource
          description: The type of attendee.
          example: required
        status:
          $ref: '#/components/schemas/ResponseStatus'
        proposedNewTime:
          $ref: '#/components/schemas/TimeSlot'

    ResponseStatus:
      type: object
      description: The response status of an attendee or organizer for a meeting request.
      properties:
        response:
          type: string
          enum:
          - none
          - organizer
          - tentativelyAccepted
          - accepted
          - declined
          - notResponded
          description: The response type.
          example: none
        time:
          type: string
          format: date-time
          description: The date and time the response was returned.

          example: '2026-01-15T10:30:00Z'
    TimeSlot:
      type: object
      description: A time period.
      properties:
        start:
          $ref: '#/components/schemas/DateTimeTimeZone'
        end:
          $ref: '#/components/schemas/DateTimeTimeZone'

    OnlineMeetingInfo:
      type: object
      description: Details for an attendee to join the meeting online.
      properties:
        joinUrl:
          type: string
          format: uri
          description: The URL to join the meeting online.
          example: https://www.example.com
        conferenceId:
          type: string
          description: The ID of the conference.
          example: '500123'
        tollNumber:
          type: string
          description: The toll number to dial for audio conference.
          example: example_value
        tollFreeNumbers:
          type: array
          items:
            type: string
          description: The toll-free numbers to dial.
          example: []
        quickDial:
          type: string
          description: The pre-formatted quick-dial for this call.
          example: example_value
        phones:
          type: array
          items:
            type: object
            properties:
              number:
                type: string
              type:
                type: string
                enum:
                - toll
                - tollFree
          description: All phone numbers associated with this conference.

          example: []
    PatternedRecurrence:
      type: object
      description: The recurrence pattern and range.
      properties:
        pattern:
          $ref: '#/components/schemas/RecurrencePattern'
        range:
          $ref: '#/components/schemas/RecurrenceRange'

    RecurrencePattern:
      type: object
      description: Describes the frequency by which a recurring event repeats.
      properties:
        type:
          type: string
          enum:
          - daily
          - weekly
          - absoluteMonthly
          - relativeMonthly
          - absoluteYearly
          - relativeYearly
          description: The recurrence pattern type.
          example: daily
        interval:
          type: integer
          description: >-
            The number of units between occurrences, where units can be in days,
            weeks, months, or years.
          example: 10
        daysOfWeek:
          type: array
          items:
            type: string
            enum:
            - sunday
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
          description: A collection of the days of the week on which the event occurs.
          example: []
        dayOfMonth:
          type: integer
          description: The day of the month on which the event occurs.
          example: 10
        month:
          type: integer
          description: The month in which the event occurs (1-12).
          example: 10
        firstDayOfWeek:
          type: string
          enum:
          - sunday
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          description: The first day of the week.
          example: sunday
        index:
          type: string
          enum:
          - first
          - second
          - third
          - fourth
          - last
          description: The week index for relative monthly and yearly patterns.

          example: first
    RecurrenceRange:
      type: object
      description: Describes a date range over which a recurring event repeats.
      properties:
        type:
          type: string
          enum:
          - endDate
          - noEnd
          - numbered
          description: The recurrence range type.
          example: endDate
        startDate:
          type: string
          format: date
          description: The start date of the series (first occurrence).
          example: '2026-01-15'
        endDate:
          type: string
          format: date
          description: The date to stop applying the recurrence pattern.
          example: '2026-01-15'
        numberOfOccurrences:
          type: integer
          description: The number of times to repeat the event.
          example: 10
        recurrenceTimeZone:
          type: string
          description: Time zone for the startDate and endDate properties.

    # ── Error schemas ──────────────────────────────────────────────────
          example: example_value
    ODataError:
      type: object
      description: The error response from the Microsoft Graph API following OData conventions.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: The error code string.
            message:
              type: string
              description: A human-readable error message.
            innerError:
              type: object
              properties:
                date:
                  type: string
                  format: date-time
                request-id:
                  type: string
                client-request-id:
                  type: string

          example: example_value
  responses:
    BadRequest:
      description: Bad request. The request body or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ODataError'
    Unauthorized:
      description: Unauthorized. A valid access token is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ODataError'
    Forbidden:
      description: Forbidden. Insufficient permissions to complete the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ODataError'
    NotFound:
      description: Not found. The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ODataError'
    TooManyRequests:
      description: Too many requests. The application has been throttled.
      headers:
        Retry-After:
          description: The number of seconds to wait before retrying the request.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ODataError'
    InternalServerError:
      description: Internal server error. An unexpected error occurred on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ODataError'
