description: Microsoft Office 365 has been folded into the Microsoft 365 brand. Pricing is per-user-per-month
  with annual commitment across Business (Basic / Standard / Premium / Apps for Business) and Enterprise
  (E3 / E5 / E7) tiers, with frontline (F1 / F3) and education SKUs available separately. Programmatic
  access is via Microsoft Graph and is included with every seat at no incremental per-call charge.
sources:
  - https://www.microsoft.com/en-us/microsoft-365/business/compare-all-plans
  - https://www.microsoft.com/en-us/microsoft-365/enterprise/microsoft365-plans-and-pricing
  - https://www.microsoft.com/en-us/microsoft-365/exchange/compare-microsoft-exchange-online-plans
plans:
  - id: microsoft-office-365-business-basic
    name: Microsoft 365 Business Basic
    type: subscription
    description: Web + mobile Office apps, Exchange, Teams, OneDrive, SharePoint. $6.00/user/month with
      Teams, $4.40/user/month without Teams (annual).
    entries:
      - label: Per user, paid yearly (with Teams)
        name: business_basic
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '6.00'
        userMultiplied: true
      - label: Per user, paid yearly (no Teams)
        name: business_basic_no_teams
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '4.40'
        userMultiplied: true
    elements:
